
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | YESID RECARGAS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="container nav-container">
    <a href="index.html" class="logo">
      <span>YR</span>
      YESID RECARGAS
    </a>
    <a href="index.html" class="btn btn-secondary">Volver a la tienda</a>
  </div>
</header>

<main class="container admin-container">

  <section id="loginSection" class="admin-login">
    <h1>Panel administrativo</h1>
    <p>Inicia sesión para gestionar tus pedidos.</p>

    <form id="loginForm">
      <label for="adminEmail">Correo electrónico</label>
      <input id="adminEmail" type="email" required>

      <label for="adminPassword">Contraseña</label>
      <input id="adminPassword" type="password" required>

      <button class="btn btn-primary" type="submit">
        Iniciar sesión
      </button>

      <p id="loginMessage"></p>
    </form>
  </section>

  <section id="dashboardSection" hidden>

    <div class="admin-heading">
      <div>
        <h1>Panel de administración 👑</h1>
        <p>Gestiona los pedidos de YESID RECARGAS.</p>
      </div>

      <button id="logoutButton" class="btn btn-secondary">
        Cerrar sesión
      </button>
    </div>

    <div class="admin-stats">
      <div class="stat-card">
        <span>Total pedidos</span>
        <strong id="totalOrders">0</strong>
      </div>

      <div class="stat-card">
        <span>Pendientes</span>
        <strong id="pendingOrders">0</strong>
      </div>

      <div class="stat-card">
        <span>Completados</span>
        <strong id="completedOrders">0</strong>
      </div>
    </div>

    <div class="orders-heading">
      <h2>Pedidos recibidos</h2>
      <button id="refreshOrders" class="btn btn-secondary">
        Actualizar
      </button>
    </div>

    <div id="ordersContainer">
      Cargando pedidos...
    </div>

  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>

</body>
</html>
